version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    # Share the db container's network so that "localhost" inside the app
    # container reaches PostgreSQL on port 5432 (no cross-container DNS needed).
    # This also means port mappings on the db service (8000, 8080) are
    # available from the host — that's where the web demos are exposed.
    network_mode: service:db
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
    depends_on:
      - db
      - pinecone
      - ollama
      - qdrant

  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: bookstore
      POSTGRES_DB: bookstore
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - default

  pinecone:
    image: ghcr.io/pinecone-io/pinecone-local:latest
    restart: unless-stopped
    environment:
      PORT: 5081
      DIMENSION: 384
    ports:
      - "5081:5081"

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Port not exposed - use host.docker.internal:11434 if local Ollama is running
    # Uncomment below if you want the container's Ollama instead
    # ports:
    #   - "11434:11434"

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  postgres-data:
  ollama-data:
  qdrant-data:
